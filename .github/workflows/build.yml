name: Compilar PKG para PS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make \
            texinfo libncurses5-dev patch python3 python-is-python3 wget zlib1g-dev \
            libtool libtool-bin python3-dev bzip2 libgmp3-dev pkg-config g++ \
            libssl-dev clang git

      - name: Preparar carpeta del toolchain
        run: |
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$USER" "$PS3DEV"

      - name: Recuperar toolchain de la caché
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-toolchain-ubuntu2204-v1

      - name: Compilar toolchain PS3 (solo la primera vez, tarda mucho)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3dev.git /tmp/ps3dev
          cd /tmp/ps3dev
          ./toolchain.sh

      - name: Guardar toolchain en la caché
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-toolchain-ubuntu2204-v1

      - name: Ordenar archivos del proyecto
        run: |
          mkdir -p source
          [ -f main.c ] && mv main.c source/ || true
          [ -f font8x16.h ] && mv font8x16.h source/ || true
          ls -R .

      - name: Compilar el gestor y crear el PKG
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          make pkg

      - name: Subir el PKG
        uses: actions/upload-artifact@v4
        with:
          name: gestor-archivos-ps3-pkg
          path: "*.pkg"
